<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <title>SIVET CLOUD - Iniciar Sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body
  class="font-sans text-gray-800 antialiased min-h-screen flex items-center justify-center p-4"
  style="background-image: url('images/fondo.png'); background-size: cover; background-position: center; background-repeat: no-repeat;"
>

  <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-gray-100 p-8">

    <div class="text-center mb-8">
      <img src="images/logo.png" alt="SIVET CLOUD" class="h-20 w-auto mx-auto mb-2" />
      <p class="text-sm text-gray-500 mt-1">Sistema de Gestión Veterinaria</p>
    </div>

    <!-- El envío se maneja por JS (Fetch API) en js/auth.js, por eso no usamos action/method tradicionales -->
    <form id="login-form" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
        <input
          type="email" id="email" name="email" required
          placeholder="admin@sivetcloud.com"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <div class="relative">
          <input
            type="password" id="password" name="password" required
            placeholder="••••••••"
            class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
          <button
            type="button" id="toggle-password"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 focus:outline-none"
            aria-label="Mostrar contraseña"
          >
            <!-- Ícono de "ojo abierto" (mostrar). Se intercambia por "ojo tachado" al hacer clic, vía JS. -->
            <svg id="toggle-password-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mensajes de error de la API (credenciales incorrectas, etc.) se insertan aquí vía JS -->
      <p id="error-message" class="text-sm text-red-600 min-h-[1em]"></p>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg py-2.5 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      >
        Iniciar sesión
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿Eres dueño de una mascota y no tienes cuenta?
      <a href="register.html" class="text-blue-600 hover:underline font-medium">Regístrate</a>
    </p>
  </div>

  <!-- Mostrar/ocultar contraseña: cambia el type del input y el ícono del ojo. Es puramente visual,
       por eso vive aquí en vez de en auth.js (que solo maneja la lógica de negocio del login). -->
  <script>
    const togglePasswordBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-password-icon');

    // Paths de los dos íconos (ojo abierto / ojo tachado), para no cargar un ícono extra por archivo
    const eyeOpenPath = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    `;
    const eyeClosedPath = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
    `;

    togglePasswordBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleIcon.innerHTML = isHidden ? eyeClosedPath : eyeOpenPath;
      togglePasswordBtn.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  </script>

  <!-- Sin cambios: mismo script, mismos IDs (#login-form, #email, #password, #error-message) -->
  <script src="js/auth.js"></script>
</body>
</html>
