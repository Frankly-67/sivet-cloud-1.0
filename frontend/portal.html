<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <title>SIVET CLOUD - Mi Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
  </script>
</head>
<body class="font-sans bg-gray-100 text-gray-800 antialiased min-h-screen">

  <!-- Navbar simple (sin sidebar): un CLIENT solo tiene 3 secciones de solo lectura,
       no necesita la navegación administrativa completa del panel interno. -->
  <nav class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 md:px-8">
    <img src="images/logo.png" alt="SIVET CLOUD" class="h-9 w-auto" />
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-gray-500 hidden sm:inline"></span>
      <button id="logout-btn" class="text-sm font-medium text-gray-600 border border-gray-300 rounded-lg px-3 py-1.5 hover:bg-gray-50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">Cerrar sesión</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 md:p-8">
    <h1 class="text-xl font-semibold text-gray-900 mb-1">Mi portal</h1>
    <p class="text-sm text-gray-500 mb-6">Consulta tus mascotas, tus citas agendadas y el historial médico</p>

    <!-- Pestañas: alternan qué panel de abajo está visible, todo del lado del cliente (sin recargar) -->
    <div class="flex gap-1 border-b border-gray-200 mb-6">
      <button id="tab-pets" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-blue-600 text-blue-600">Mis mascotas</button>
      <button id="tab-appointments" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Mis citas</button>
      <button id="tab-records" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Historial médico</button>
    </div>

    <!-- Panel: Mis mascotas -->
    <section id="panel-pets" class="tab-panel">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Nombre</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Especie</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Raza</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Peso</th>
            </tr>
          </thead>
          <tbody id="pets-table-body" class="divide-y divide-gray-100">
            <!-- Filas insertadas dinámicamente desde js/portal.js -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Panel: Mis citas -->
    <section id="panel-appointments" class="tab-panel hidden">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Mascota</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Veterinario</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Fecha</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Motivo</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Estado</th>
            </tr>
          </thead>
          <tbody id="appointments-table-body" class="divide-y divide-gray-100">
            <!-- Filas insertadas dinámicamente desde js/portal.js -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Panel: Historial médico -->
    <section id="panel-records" class="tab-panel hidden">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Mascota</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Veterinario</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Diagnóstico</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Fecha</th>
              <th class="text-left font-medium text-gray-600 px-4 py-3">Fórmula</th>
            </tr>
          </thead>
          <tbody id="records-table-body" class="divide-y divide-gray-100">
            <!-- Filas insertadas dinámicamente desde js/portal.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Reutilizamos dashboard.js tal cual: su guardia de ruta, #user-name y #logout-btn
       son genéricos (no dependen del rol), así que funcionan igual aquí que en el panel admin. -->
  <script src="js/dashboard.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
